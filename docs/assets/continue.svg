<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="630" viewBox="0 0 1280 630" role="img" aria-label="Continuing a session from the phone: with its Claude window open, the phone gets a copy that can come back to the window later; with the window closed, the phone carries on with the session itself">
<title>Continuing a session from the phone: with its Claude window open, the phone gets a copy that can come back to the window later; with the window closed, the phone carries on with the session itself</title>
<style>
  .m .bd { animation: bob 3.4s ease-in-out infinite; animation-delay: var(--d); }
  .m .gl { animation: glow 2.6s ease-in-out infinite; animation-delay: var(--d); }
  .m .ey { transform-box: fill-box; transform-origin: center; animation: blink 6s infinite; animation-delay: var(--d); }
  @keyframes bob { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-1.1px) } }
  @keyframes glow { 0%, 100% { opacity: .25 } 50% { opacity: 1 } }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1) } 96% { transform: scaleY(.12) } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important } .flow { display: none } }</style>
