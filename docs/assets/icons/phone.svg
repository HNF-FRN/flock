<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="phone">
<title>phone</title>
<style>
  .m .bd { animation: bob 3.4s ease-in-out infinite; animation-delay: var(--d); }
