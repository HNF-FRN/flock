<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-label="Sign-in links: Flock catches the claude:// link Windows hands to the main window and passes it to the account that is signing in">
<title>Sign-in links: Flock catches the claude:// link Windows hands to the main window and passes it to the account that is signing in</title>
<style>
  .m .bd { animation: bob 3.4s ease-in-out infinite; animation-delay: var(--d); }
  .m .gl { animation: glow 2.6s ease-in-out infinite; animation-delay: var(--d); }
  .m .ey { transform-box: fill-box; transform-origin: center; animation: blink 6s infinite; animation-delay: var(--d); }
  @keyframes bob { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-1.1px) } }
  @keyframes glow { 0%, 100% { opacity: .25 } 50% { opacity: 1 } }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1) } 96% { transform: scaleY(.12) } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important } .flow { display: none } }</style>
<defs>
    <radialGradient id="pP" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(204.8 24) scale(640 528)"><stop offset="0" stop-color="#3B2F63" stop-opacity=".85"/><stop offset="1" stop-color="#3B2F63" stop-opacity="0"/></radialGradient>
    <radialGradient id="pT" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1152 480) scale(640 528)"><stop offset="0" stop-color="#1D4A5C" stop-opacity=".8"/><stop offset="1" stop-color="#1D4A5C" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" fill-opacity=".045"/></pattern>
    <clipPath id="card"><rect width="1280" height="480" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="480" fill="#08090B"/>
    <rect width="1280" height="480" fill="url(#pP)"/>
    <rect width="1280" height="480" fill="url(#pT)"/>
    <rect width="1280" height="480" fill="url(#dots)"/>
  </g>
  <rect x=".5" y=".5" width="1279" height="479" rx="27.5" fill="none" stroke="#fff" stroke-opacity=".07"/>
  <defs><filter id="soft" x="-20%" y="-300%" width="140%" height="700%"><feGaussianBlur stdDeviation="6"/></filter></defs>
  <text x="40" y="78" font-family="'Cascadia Mono','Cascadia Code',Consolas,'SF Mono',Menlo,monospace" font-size="12" letter-spacing="2" fill="#9398A1">SIGNING IN TO AN EXTRA ACCOUNT</text>
  <text x="40" y="112" font-family="'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="650" fill="#F5F6F8">Sign-in links skip Main and reach the window that asked for them.</text>
  <circle cx="62" cy="170" r="13" fill="none" stroke="#fff" stroke-opacity=".25"/><text x="62" y="175" text-anchor="middle" font-family="'Cascadia Mono','Cascadia Code',Consolas,'SF Mono',Menlo,monospace" font-size="13" fill="#F5F6F8">1</text><circle cx="372" cy="170" r="13" fill="none" stroke="#fff" stroke-opacity=".25"/><text x="372" y="175" text-anchor="middle" font-family="'Cascadia Mono','Cascadia Code',Consolas,'SF Mono',Menlo,monospace" font-size="13" fill="#F5F6F8">2</text><circle cx="692" cy="170" r="13" fill="none" stroke="#fff" stroke-opacity=".25"/><text x="692" y="175" text-anchor="middle" font-family="'Cascadia Mono','Cascadia Code',Consolas,'SF Mono',Menlo,monospace" font-size="13" fill="#F5F6F8">3</text>
  <g class="flow"><rect x="-34" y="-12" width="68" height="24" rx="12" fill="#38BDF8"/><text y="4.5" text-anchor="middle" font-family="'Cascadia Mono','Cascadia Code',Consolas,'SF Mono',Menlo,monospace" font-size="12" font-weight="600" fill="#0E0F11">claude://</text><animateMotion dur="4.2s" repeatCount="indefinite" path="M200 270 L 920 270 C 955 270, 955 176, 986 176" keyPoints="0;1;1" keyTimes="0;.8;1" calcMode="linear"/></g>
  <rect x="40" y="196" width="250" height="148" rx="18" fill="#0E0F11" stroke="#fff" stroke-opacity=".09"/>
  <text x="62" y="236" font-family="'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="650" fill="#F5F6F8">You sign in</text>
  <text x="62" y="264" font-family="'Segoe UI Variable Text','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#9398A1">Google, or the link in</text>
  <text x="62" y="285" font-family="'Segoe UI Variable Text','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#9398A1">the e-mail, in your browser</text>
  <text x="62" y="322" font-family="'Cascadia Mono','Cascadia Code',Consolas,'SF Mono',Menlo,monospace" font-size="13" fill="#6B7079">claude://login…</text>
  <rect x="350" y="196" width="260" height="148" rx="18" fill="#0E0F11" stroke="#fff" stroke-opacity=".09"/>
  <text x="372" y="236" font-family="'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="650" fill="#F5F6F8">Windows</text>
  <text x="372" y="264" font-family="'Segoe UI Variable Text','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#9398A1">starts a short-lived Claude.exe</text>
  <text x="372" y="285" font-family="'Segoe UI Variable Text','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#9398A1">meant for your main window</text>
  <text x="372" y="322" font-family="'Cascadia Mono','Cascadia Code',Consolas,'SF Mono',Menlo,monospace" font-size="13" fill="#6B7079">Claude.exe "claude://…"</text>
  <rect x="670" y="196" width="250" height="148" rx="18" fill="#0E0F11" stroke="#fff" stroke-opacity=".09"/>
  <text x="692" y="236" font-family="'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="650" fill="#F5F6F8">Flock</text>
  <text x="692" y="264" font-family="'Segoe UI Variable Text','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#9398A1">spots it in about 0.1 s</text>
  <text x="692" y="285" font-family="'Segoe UI Variable Text','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#9398A1">and takes the link</text>
  <text x="692" y="322" font-family="'Cascadia Mono','Cascadia Code',Consolas,'SF Mono',Menlo,monospace" font-size="13" fill="#6B7079">WMI process-start event</text>
  <g class="m " transform="translate(862 210) scale(1)" style="--d:-1s">
  <defs>
    <linearGradient id="m10b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7f7f9"/><stop offset="1" stop-color="#dddddf"/></linearGradient>
    <radialGradient id="m10h" cx=".3" cy=".08" r=".75"><stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <radialGradient id="m10g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fbfbfc" stop-opacity=".9"/><stop offset="1" stop-color="#fbfbfc" stop-opacity="0"/></radialGradient>
    <radialGradient id="m10s" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  </defs>
  
  <g class="bd">
    <rect x="11.6" y="31.4" width="5.2" height="4.8" rx="2.4" fill="#7b7b7c"/>
    <rect x="23.2" y="31.4" width="5.2" height="4.8" rx="2.4" fill="#7b7b7c"/>
    <path d="M26.6 12.8 Q27.4 9.6 28.6 7.4" fill="none" stroke="#7b7b7c" stroke-width="1.6" stroke-linecap="round"/>
    <circle class="gl" cx="29" cy="6.4" r="4.6" fill="url(#m10g)"/>
    <circle cx="29" cy="6.4" r="2.3" fill="#fbfbfc"/>
    <rect x="5.5" y="11.5" width="29" height="22" rx="8.5" fill="url(#m10b)"/>
    <rect x="5.5" y="11.5" width="29" height="22" rx="8.5" fill="url(#m10h)"/>
    <g class="ey" fill="#141413">
      <rect x="13.6" y="18.6" width="3.4" height="5.6" rx="1.7"/>
      <rect x="23" y="18.6" width="3.4" height="5.6" rx="1.7"/>
    </g>
  </g>
</g>
  <g>
    <rect x="1004" y="117" width="222" height="6" rx="3" fill="#38BDF8" opacity=".55" filter="url(#soft)"/>
    <rect x="990" y="120" width="250" height="112" rx="12" fill="#0E0F11" stroke="#fff" stroke-opacity=".09"/>
    <rect x="1004" y="120" width="222" height="2.5" rx="1.25" fill="#38BDF8" opacity="1"/>
    <text x="1008" y="151" font-family="'Segoe UI Variable Text','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#F5F6F8">Work — Claude</text>
    <g stroke="#6B7079" stroke-width="1.4" fill="none" stroke-linecap="round">
      <path d="M1163 146h9"/>
      <rect x="1188" y="141.5" width="9" height="9" rx="1.5"/>
      <path d="M1213 141.5l9 9M1222 141.5l-9 9"/>
    </g>
    <path d="M990 166h250" stroke="#fff" stroke-opacity=".06"/>
    <circle cx="1012" cy="196" r="9" fill="#4ADE80"/><path d="M1007.5 196.3l3 3 6-6.2" fill="none" stroke="#0E0F11" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1030" y="201" font-family="'Segoe UI Variable Text','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#F5F6F8">signed in, the right window</text>
  </g>
  <g opacity=".55"><g>
    
    <rect x="990" y="300" width="250" height="112" rx="12" fill="#0E0F11" stroke="#fff" stroke-opacity=".09"/>
    <rect x="1004" y="300" width="222" height="2.5" rx="1.25" fill="#D97757" opacity="0.75"/>
    <text x="1008" y="331" font-family="'Segoe UI Variable Text','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#F5F6F8">Main — Claude</text>
    <g stroke="#6B7079" stroke-width="1.4" fill="none" stroke-linecap="round">
      <path d="M1163 326h9"/>
      <rect x="1188" y="321.5" width="9" height="9" rx="1.5"/>
      <path d="M1213 321.5l9 9M1222 321.5l-9 9"/>
    </g>
    <path d="M990 346h250" stroke="#fff" stroke-opacity=".06"/>
    <text x="1008" y="381" font-family="'Segoe UI Variable Text','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#9398A1">left alone</text>
  </g></g>
